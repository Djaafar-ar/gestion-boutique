name: billing_app
description: Offline shop management app (sales, stock, suppliers, statistics).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  get_it: ^7.6.7
  equatable: ^2.0.5

  # Functional Programming
  fpdart: ^1.1.0

  # Navigation
  go_router: ^14.0.0

  # Database (SQLite through drift)
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1

  # Old database, only read once to import data from the previous version
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Utilities
  intl: any
  vibration: ^3.1.8
  permission_handler: ^11.3.1
  uuid: ^4.5.2
  app_settings: ^7.0.0
  crypto: ^3.0.7 # PIN hashing

  # Scanner & Printer
  pretty_qr_code: ^3.3.0
  print_bluetooth_thermal: ^1.1.2
  mobile_scanner: ^5.1.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  fl_chart: ^1.2.0
  flutter_foreground_task: ^11.0.3
  http: ^1.6.0
  archive: ^4.3.0
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  workmanager: ^0.10.10
  connectivity_plus: ^7.3.1
  sqlite3: ^3.5.2 # reads a backup file before restoring it

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code Generation (run: dart run build_runner build)
  build_runner: ^2.4.8
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true
  generate: true

  # Fonts are bundled so the app never needs internet.
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
